version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "Building backend Docker image..."
      - cd backend
      - docker build -t $BACKEND_IMAGE_NAME .
      - cd ..

      - echo "Building frontend Docker image..."
      - cd frontend
      - docker build -t $FRONTEND_IMAGE_NAME .
      - cd ..

  post_build:
    commands:
      - echo "Tagging backend Docker image..."
      - docker tag $BACKEND_IMAGE_NAME:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_IMAGE_NAME:latest

      - echo "Tagging frontend Docker image..."
      - docker tag $FRONTEND_IMAGE_NAME:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_IMAGE_NAME:latest

      - echo "Pushing backend Docker image to ECR..."
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_IMAGE_NAME:latest

      - echo "Pushing frontend Docker image to ECR..."
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_IMAGE_NAME:latest

artifacts:
  files:
    - '**/*'